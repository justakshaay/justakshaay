      animation-delay: -4.2s;
    }
    @keyframes kf-f1-c4 {
      0%   { transform: translate(0px, 0px); }
      40%  { transform: translate(-144px, -144px); }
      55%  { transform: translate(-144px, -144px); }
      90%  { transform: translate(0px, 0px); }
      100% { transform: translate(0px, 0px); }
