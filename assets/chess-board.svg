  <style>
@keyframes glowPulse { 0%,100% { opacity:0.55; } 50% { opacity:0.9; } }
.gp { animation: glowPulse 3.5s ease-in-out infinite; }
    @keyframes kf-e2-e4 {
      0%   { transform: translate(0px, 0px); }
      40%  { transform: translate(0px, -96px); }
      55%  { transform: translate(0px, -96px); }
      90%  { transform: translate(0px, 0px); }
      100% { transform: translate(0px, 0px); }
    }
    .move-e2-e4 {
      animation: kf-e2-e4 10s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      animation-delay: 0s;
    }
    @keyframes kf-e7-e5 {
      0%   { transform: translate(0px, 0px); }
      40%  { transform: translate(0px, 96px); }
      55%  { transform: translate(0px, 96px); }
      90%  { transform: translate(0px, 0px); }
      100% { transform: translate(0px, 0px); }
    }
    .move-e7-e5 {
