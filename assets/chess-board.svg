<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="70%"  stop-color="#082f49" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#071a19" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1f1e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061414" stop-opacity="0.88"/>
    </linearGradient>
    <!-- White piece glow: cyan halo -->
    <filter id="wGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.60" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Black piece glow: teal halo -->
    <filter id="bGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.0" result="blur"/>
      <feFlood flood-color="#14b8a6" flood-opacity="0.50" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p-P" d="M -9,12 L 9,12 C 7,12 7,9 5,9 C 4,9 4,4 5,2 C 7,1 8,-1 8,-4 C 8,-8 4,-11 0,-11 C -4,-11 -8,-8 -8,-4 C -8,-1 -7,1 -5,2 C -4,4 -4,9 -5,9 C -7,9 -7,12 -9,12 Z"/>
    <path id="p-R" d="M -10,12 L 10,12 C 8,12 8,9 6,9 L 6,-4 L 9,-4 L 9,-12 L 5,-12 L 5,-8 L 2,-8 L 2,-12 L -2,-12 L -2,-8 L -5,-8 L -5,-12 L -9,-12 L -9,-4 L -6,-4 L -6,9 C -8,9 -8,12 -10,12 Z"/>
    <path id="p-N" d="M -10,12 L 10,12 C 8,12 8,9 6,9 C 6,7 8,5 9,1 C 10,-3 9,-7 7,-10 C 6,-12 4,-13 2,-13 C 0,-13 0,-11 -2,-9 C -3,-9 -6,-7 -9,-5 C -11,-3 -10,0 -8,1 C -6,2 -5,4 -5,9 C -7,9 -7,12 -10,12 Z"/>
    <path id="p-B" d="M -10,12 L 10,12 C 8,12 8,9 5,9 C 4,7 5,3 6,0 C 7,-4 7,-8 4,-11 C 3,-12 1,-12 1,-14 C 1,-15 0,-15 0,-14 C 0,-12 -2,-12 -3,-11 C -6,-8 -6,-4 -5,0 C -4,3 -3,7 -4,9 C -7,9 -7,12 -10,12 Z"/>
    <path id="p-Q" d="M -11,12 L 11,12 C 9,12 8,9 5,9 L 9,-2 L 9,-10 L 5,-6 L 0,-13 L -5,-6 L -9,-10 L -9,-2 L -5,9 C -8,9 -9,12 -11,12 Z"/>
