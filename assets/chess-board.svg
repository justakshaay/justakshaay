      animation-delay: -1.4s;
    }
    @keyframes kf-g1-f3 {
      0%   { transform: translate(0px, 0px); }
      40%  { transform: translate(-48px, -96px); }
      55%  { transform: translate(-48px, -96px); }
      90%  { transform: translate(0px, 0px); }
      100% { transform: translate(0px, 0px); }
    }
    .move-g1-f3 {
