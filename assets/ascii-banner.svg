<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-cursor { animation: cursorBlink 1.2s infinite; }
  </style>

  <!-- Deep Navy-Slate Terminal Canvas (#0b1120) with Refined Border -->
  <rect x="1" y="1" width="898" height="178" rx="14" fill="#0b1120" stroke="url(#termBorderGrad)" stroke-width="1.5" />

  <!-- Terminal Top Bar (#0f172a) -->
  <rect x="1" y="1" width="898" height="38" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <rect x="1" y="22" width="898" height="16" fill="#0f172a" />
  <line x1="1" y1="38" x2="899" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="24" cy="19" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="19" r="5.5" fill="#f59e0b" />
  <circle cx="60" cy="19" r="5.5" fill="#22c55e" />

  <!-- Terminal Command Title with Blinking Cursor -->
  <text x="450" y="24" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#64748b" font-weight="600">justakshaay@github:~$ ./wordmark.sh --user <tspan class="term-cursor" fill="#2dd4bf">_</tspan></text>

  <!-- Crisp White/Silver (#e2e8f0) Monospace ASCII Art: AKSHAY KUMAR -->
  <g font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#e2e8f0" font-weight="bold" xml:space="preserve" text-anchor="middle">
    <text x="450" y="72">    _      _  __  ____    _   _      _     __   __        _  __  _   _   __  __      _      ____  </text>
    <text x="450" y="90">   / \    | |/ / / ___|  | | | |    / \    \ \ / /       | |/ / | | | | |  \/  |    / \    |  _ \ </text>
    <text x="450" y="108">  / _ \   | ' /  \___ \  | |_| |   / _ \    \ V /        | ' /  | | | | | |\/| |   / _ \   | |_) |</text>
    <text x="450" y="126"> / ___ \  | . \   ___) | |  _  |  / ___ \    | |         | . \  | |_| | | |  | |  / ___ \  |  _ &lt; </text>
    <text x="450" y="144">/_/   \_\ |_|\_\ |____/  |_| |_| /_/   \_\   |_|         |_|\_\  \___/  |_|  |_| /_/   \_\ |_| \_\</text>
  </g>
</svg>