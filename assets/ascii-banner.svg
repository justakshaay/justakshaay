<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Teal Glow for Layer 2 -->
    <filter id="tealGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#2dd4bf" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    /* Continuous smooth 4.5s cross-fade loop between Layer 1 and Layer 2 */
    @keyframes fadeBold {
      0%, 35% { opacity: 1; }
      50%, 85% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes fadeLight {
      0%, 35% { opacity: 0; }
      50%, 85% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .style-bold {
      animation: fadeBold 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .style-light {
      animation: fadeLight 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .term-cursor {
      animation: cursorBlink 1.2s infinite;
    }
    ]]>
  </style>

  <!-- Deep Navy-Slate Terminal Canvas (#0b1120) with Refined Border -->
  <rect x="1" y="1" width="958" height="198" rx="14" fill="#0b1120" stroke="url(#termBorderGrad)" stroke-width="1.5" />

  <!-- Terminal Top Bar (#0f172a) -->
  <rect x="1" y="1" width="958" height="38" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <rect x="1" y="22" width="958" height="16" fill="#0f172a" />
  <line x1="1" y1="38" x2="959" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- macOS Control Dots -->
  <circle cx="24" cy="19" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="19" r="5.5" fill="#f59e0b" />
  <circle cx="60" cy="19" r="5.5" fill="#22c55e" />

  <!-- Terminal Command Title with Blinking Cursor -->
  <text x="480" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#64748b" font-weight="600" xml:space="preserve" style="white-space: pre;">justakshaay@github:~$ ./wordmark.sh --name <tspan class="term-cursor" fill="#2dd4bf">_</tspan></text>

  <!-- Layer 1: Dense Bold ASCII Style (#e2e8f0 crisp white/silver) -->
  <g class="style-bold" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13.5px" fill="#e2e8f0" font-weight="bold" text-anchor="start">
    <text x="71" y="74" xml:space="preserve" style="white-space: pre;">&#160;&#160;████&#160;&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;&#160;██████&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;████&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;███&#160;&#160;███&#160;&#160;&#160;████&#160;&#160;&#160;██████&#160;&#160;</text>
    <text x="71" y="96" xml:space="preserve" style="white-space: pre;">&#160;██&#160;&#160;██&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;&#160;&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;██&#160;██&#160;&#160;██&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;██&#160;</text>
    <text x="71" y="118" xml:space="preserve" style="white-space: pre;">████████&#160;█████&#160;&#160;&#160;&#160;&#160;█████&#160;&#160;&#160;████████&#160;████████&#160;&#160;&#160;████&#160;&#160;&#160;&#160;&#160;&#160;█████&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;█&#160;&#160;██&#160;████████&#160;██████&#160;&#160;</text>
    <text x="71" y="140" xml:space="preserve" style="white-space: pre;">██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;██&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;&#160;&#160;&#160;██&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;██&#160;</text>
    <text x="71" y="162" xml:space="preserve" style="white-space: pre;">██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;██&#160;&#160;██████&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;&#160;&#160;&#160;&#160;&#160;&#160;██&#160;&#160;&#160;██&#160;&#160;&#160;██████&#160;&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;&#160;██&#160;██&#160;&#160;&#160;&#160;██</text>
  </g>

  <!-- Layer 2: Light Geometric ASCII Style (#cbd5e1 with subtle #2dd4bf glow) -->
  <g class="style-light" filter="url(#tealGlow)" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13.5px" fill="#cbd5e1" font-weight="bold" text-anchor="start">
    <text x="71" y="74" xml:space="preserve" style="white-space: pre;">&#160;&#160;.::.&#160;&#160;&#160;+:&#160;&#160;&#160;:+&#160;&#160;&#160;.::::.&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;&#160;&#160;.::.&#160;&#160;&#160;:+&#160;&#160;&#160;&#160;+:&#160;&#160;&#160;&#160;+:&#160;&#160;&#160;:+&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;:+&#160;&#160;&#160;&#160;+:&#160;&#160;&#160;.::.&#160;&#160;&#160;:+===:&#160;&#160;</text>
    <text x="71" y="96" xml:space="preserve" style="white-space: pre;">&#160;:+&#160;&#160;+:&#160;&#160;+:&#160;&#160;:+&#160;&#160;&#160;:+&#160;&#160;&#160;&#160;&#160;&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;&#160;:+&#160;&#160;+:&#160;&#160;&#160;:+&#160;&#160;+:&#160;&#160;&#160;&#160;&#160;+:&#160;&#160;:+&#160;&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;:+:+:++:&#160;&#160;:+&#160;&#160;+:&#160;&#160;:*&#160;&#160;&#160;+:&#160;</text>
    <text x="71" y="118" xml:space="preserve" style="white-space: pre;">:+====+:&#160;+:==:&#160;&#160;&#160;&#160;&#160;:=++:&#160;&#160;&#160;:*====*:&#160;:+====+:&#160;&#160;&#160;:++:&#160;&#160;&#160;&#160;&#160;&#160;+:==:&#160;&#160;&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;:+&#160;::&#160;+:&#160;:+====+:&#160;:*===:&#160;&#160;</text>
    <text x="71" y="140" xml:space="preserve" style="white-space: pre;">:*&#160;&#160;&#160;&#160;*:&#160;+:&#160;&#160;:+&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;+:&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;:*&#160;&#160;&#160;&#160;*:&#160;&#160;&#160;&#160;::&#160;&#160;&#160;&#160;&#160;&#160;&#160;+:&#160;&#160;:+&#160;&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;:+&#160;&#160;&#160;&#160;+:&#160;:*&#160;&#160;&#160;&#160;*:&#160;:*&#160;&#160;&#160;+:&#160;</text>
    <text x="71" y="162" xml:space="preserve" style="white-space: pre;">:*&#160;&#160;&#160;&#160;*:&#160;+:&#160;&#160;&#160;:+&#160;&#160;.::::.&#160;&#160;&#160;:*&#160;&#160;&#160;&#160;*:&#160;:*&#160;&#160;&#160;&#160;*:&#160;&#160;&#160;&#160;::&#160;&#160;&#160;&#160;&#160;&#160;&#160;+:&#160;&#160;&#160;:+&#160;&#160;&#160;.::::.&#160;&#160;:+&#160;&#160;&#160;&#160;+:&#160;:*&#160;&#160;&#160;&#160;*:&#160;:*&#160;&#160;&#160;&#160;*:</text>
  </g>
</svg>