<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Aura Double-Frame Outer Gradient -->
    <linearGradient id="focusOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#0d9488" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#082f49" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#071a19" />
    </linearGradient>

    <radialGradient id="focusAuraRadial" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#071a19" stop-opacity="0" />
    </radialGradient>

    <!-- Sub-card background gradient -->
    <linearGradient id="subCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082725" />
      <stop offset="100%" stop-color="#041615" />
    </linearGradient>
  </defs>

  <style>
    @keyframes focusPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .focus-aura { animation: focusPulse 5s ease-in-out infinite alternate; }
  </style>

  <!-- Base Canvas -->
  <rect x="0" y="0" width="920" height="280" rx="18" fill="#071a19" />

  <!-- Outer Frame: Aura Glow & Gradient Border -->
  <rect x="1" y="1" width="918" height="278" rx="18" fill="url(#focusOuterGrad)" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.35" />
  <rect class="focus-aura" x="1" y="1" width="918" height="278" rx="18" fill="url(#focusAuraRadial)" />

  <!-- Inner Recessed Panel (14px inset, 88% dark fill, 20% teal border) -->
  <rect x="14" y="14" width="892" height="252" rx="12" fill="#061414" fill-opacity="0.88" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.20" />

  <!-- Header Micro-Labels -->
  <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#2dd4bf" letter-spacing="1.5px">ENGINEERING FOCUS // CORE DOMAINS</text>
  <text x="892" y="38" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1px">IN THE CURRENT CUT</text>

  <!-- Card 1: AI & ML (with #2dd4bf left accent bar) -->
  <g transform="translate(28, 52)">
    <rect width="422" height="96" rx="8" fill="url(#subCardBg)" stroke="#115e59" stroke-width="1" stroke-opacity="0.75" />
    <!-- Subtle Left Accent Bar matching Aura HIGHLIGHTS card -->
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#2dd4bf" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">01</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Artificial Intelligence &amp; Machine Learning</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">Machine Learning · Deep Learning · Predictive Modeling</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#2dd4bf" font-weight="500">Data Analysis · Intelligent Systems</text>
  </g>

  <!-- Card 2: Full-Stack Engineering (with #2dd4bf left accent bar) -->
  <g transform="translate(470, 52)">
    <rect width="422" height="96" rx="8" fill="url(#subCardBg)" stroke="#115e59" stroke-width="1" stroke-opacity="0.75" />
    <!-- Subtle Left Accent Bar -->
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#2dd4bf" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">02</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Full-Stack Engineering</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">Frontend Development · Backend Development</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#2dd4bf" font-weight="500">API Integration · Functional Web Applications</text>
  </g>

  <!-- Card 3: Software & Systems Engineering (with #2dd4bf left accent bar) -->
  <g transform="translate(28, 158)">
    <rect width="422" height="96" rx="8" fill="url(#subCardBg)" stroke="#115e59" stroke-width="1" stroke-opacity="0.75" />
    <!-- Subtle Left Accent Bar -->
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#2dd4bf" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">03</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Software &amp; Systems Engineering</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">C++ · Data Structures &amp; Algorithms</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#2dd4bf" font-weight="500">Problem Solving · System Architecture</text>
  </g>

  <!-- Card 4: End-to-End Product Development (with #2dd4bf left accent bar) -->
  <g transform="translate(470, 158)">
    <rect width="422" height="96" rx="8" fill="url(#subCardBg)" stroke="#115e59" stroke-width="1" stroke-opacity="0.75" />
    <!-- Subtle Left Accent Bar -->
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#2dd4bf" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">04</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">End-to-End Product Development</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">Project Architecture · Implementation</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#2dd4bf" font-weight="500">Integration · Testing · Deployment</text>
  </g>
</svg>