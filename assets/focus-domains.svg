<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a19" />
      <stop offset="100%" stop-color="#0a2724" />
    </linearGradient>
    <linearGradient id="subCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082422" />
      <stop offset="100%" stop-color="#051817" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="278" rx="16" fill="url(#panelGrad)" stroke="#134e4a" stroke-width="1.5" />

  <!-- Header Micro-Labels -->
  <text x="26" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#2dd4bf" letter-spacing="1.5px">ENGINEERING FOCUS // CORE DOMAINS</text>
  <text x="894" y="32" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1px">IN THE CURRENT CUT</text>

  <!-- Card 1: AI & ML -->
  <g transform="translate(24, 48)">
    <rect width="428" height="98" rx="10" fill="url(#subCardGrad)" stroke="#115e59" stroke-width="1" stroke-opacity="0.8" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">01</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Artificial Intelligence &amp; Machine Learning</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Machine Learning · Deep Learning · Predictive Modeling</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2dd4bf" font-weight="500">Data Analysis · Intelligent Systems</text>
  </g>

  <!-- Card 2: Full-Stack Engineering -->
  <g transform="translate(468, 48)">
    <rect width="428" height="98" rx="10" fill="url(#subCardGrad)" stroke="#115e59" stroke-width="1" stroke-opacity="0.8" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">02</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Full-Stack Engineering</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Frontend Development · Backend Development</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2dd4bf" font-weight="500">API Integration · Functional Web Applications</text>
  </g>

  <!-- Card 3: Software & Systems Engineering -->
  <g transform="translate(24, 158)">
    <rect width="428" height="98" rx="10" fill="url(#subCardGrad)" stroke="#115e59" stroke-width="1" stroke-opacity="0.8" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">03</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Software &amp; Systems Engineering</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">C++ · Data Structures &amp; Algorithms</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2dd4bf" font-weight="500">Problem Solving · System Architecture</text>
  </g>

  <!-- Card 4: End-to-End Product Development -->
  <g transform="translate(468, 158)">
    <rect width="428" height="98" rx="10" fill="url(#subCardGrad)" stroke="#115e59" stroke-width="1" stroke-opacity="0.8" />
    <rect x="16" y="14" width="28" height="20" rx="4" fill="#0d3632" stroke="#2dd4bf" stroke-width="0.8" />
    <text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2dd4bf">04</text>
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">End-to-End Product Development</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Project Architecture · Implementation</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2dd4bf" font-weight="500">Integration · Testing · Deployment</text>
